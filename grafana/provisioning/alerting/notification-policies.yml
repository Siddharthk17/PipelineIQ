apiVersion: 1
# Route every alert to email by default. Add route overrides here (e.g.
# severity=warning → Slack) instead of editing in the UI, so config stays
# in git and survives volume wipes.
policies:
  - orgId: 1
    receiver: pipelineiq-email
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
