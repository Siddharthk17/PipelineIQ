name: Feature request
description: Propose a new capability or improvement for PipelineIQ.
title: "[feat]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What user or operator pain does this solve? What can't you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? Include API shapes, UI sketches (text is fine), or YAML examples.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches and why they fall short (workarounds you use today count).
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Backend API
        - Pipeline engine / execution
        - Frontend dashboard
        - Scheduling / workers
        - Auth / security
        - Observability (Prometheus/Grafana)
        - Deployment (Compose/k8s)
        - Docs / DX
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I am willing to implement this (with maintainer guidance)
