name: Deploy to Civo k3s

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/pipelineiq-backend
  PYTHON_VERSION: "3.11"

jobs:
  build-and-push:
    name: Build and Push to GHCR
    runs-on: ubuntu-22.04
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy:
    name: Deploy to Production
    needs: build-and-push
    runs-on: ubuntu-22.04

    environment:
      name: production
      url: https://pipelineiq-api.onrender.com

    steps:
      - uses: actions/checkout@v7

      - name: Check if KUBE_CONFIG is available
        id: check-kube
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG_B64" ]; then
            echo "KUBE_CONFIG secret not set — running in dry-run mode"
            echo "dry-run=true" >> $GITHUB_OUTPUT
          else
            echo "dry-run=false" >> $GITHUB_OUTPUT
          fi

      - name: Install kubectl
        if: steps.check-kube.outputs.dry-run == 'false'
        uses: azure/setup-kubectl@v3
        with:
          version: v1.29.0

      - name: Configure kubectl for Civo
        if: steps.check-kube.outputs.dry-run == 'false'
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBE_CONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl config current-context

      - name: Verify cluster connectivity
        if: steps.check-kube.outputs.dry-run == 'false'
        run: kubectl get nodes

      - name: Update Kubernetes secrets
        if: steps.check-kube.outputs.dry-run == 'false'
        env:
          DB_URL: ${{ secrets.DATABASE_URL }}
          DB_WRITE_URL: ${{ secrets.DATABASE_WRITE_URL }}
          DB_READ_URL: ${{ secrets.DATABASE_READ_URL }}
          PG_USER: ${{ secrets.POSTGRES_USER }}
          PG_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          PG_DB: ${{ secrets.POSTGRES_DB }}
          REDIS_PW: ${{ secrets.REDIS_PASSWORD }}
          REDIS_BROKER: ${{ secrets.REDIS_BROKER_URL }}
          REDIS_BACKEND: ${{ secrets.REDIS_BACKEND_URL }}
          REDIS_PUBSUB: ${{ secrets.REDIS_PUBSUB_URL }}
          REDIS_CACHE: ${{ secrets.REDIS_CACHE_URL }}
          REDIS_YJS: ${{ secrets.REDIS_YJS_URL }}
          CELERY_BACKEND: ${{ secrets.CELERY_RESULT_BACKEND }}
          JWT_S: ${{ secrets.JWT_SECRET }}
          APP_S: ${{ secrets.SECRET_KEY }}
          FLOWER_U: ${{ secrets.FLOWER_USER }}
          FLOWER_P: ${{ secrets.FLOWER_PASSWORD }}
          GRAFANA_U: ${{ secrets.GRAFANA_USER }}
          GRAFANA_P: ${{ secrets.GRAFANA_PASSWORD }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_V: ${{ secrets.GEMINI_MODEL }}
          GEMINI_FALLBACK_V: ${{ secrets.GEMINI_FALLBACK_MODELS }}
          MINIO_U: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_P: ${{ secrets.MINIO_ROOT_PASSWORD }}
          S3_AK: ${{ secrets.S3_ACCESS_KEY }}
          S3_SK: ${{ secrets.S3_SECRET_KEY }}
        run: |
          kubectl delete secret pipelineiq-secrets -n pipelineiq --ignore-not-found
          kubectl create secret generic pipelineiq-secrets \
            --namespace=pipelineiq \
            --from-literal=DATABASE_URL="$DB_URL" \
            --from-literal=DATABASE_WRITE_URL="$DB_WRITE_URL" \
            --from-literal=DATABASE_READ_URL="$DB_READ_URL" \
            --from-literal=POSTGRES_USER="$PG_USER" \
            --from-literal=POSTGRES_PASSWORD="$PG_PASSWORD" \
            --from-literal=POSTGRES_DB="$PG_DB" \
            --from-literal=REDIS_PASSWORD="$REDIS_PW" \
            --from-literal=REDIS_BROKER_URL="$REDIS_BROKER" \
            --from-literal=REDIS_BACKEND_URL="$REDIS_BACKEND" \
            --from-literal=REDIS_PUBSUB_URL="$REDIS_PUBSUB" \
            --from-literal=REDIS_CACHE_URL="$REDIS_CACHE" \
            --from-literal=REDIS_YJS_URL="$REDIS_YJS" \
            --from-literal=CELERY_RESULT_BACKEND="$CELERY_BACKEND" \
            --from-literal=JWT_SECRET="$JWT_S" \
            --from-literal=SECRET_KEY="$APP_S" \
            --from-literal=FLOWER_USER="$FLOWER_U" \
            --from-literal=FLOWER_PASSWORD="$FLOWER_P" \
            --from-literal=GRAFANA_USER="$GRAFANA_U" \
            --from-literal=GRAFANA_PASSWORD="$GRAFANA_P" \
            --from-literal=GEMINI_API_KEY="$GEMINI_KEY" \
            --from-literal=GEMINI_MODEL="$GEMINI_MODEL_V" \
            --from-literal=GEMINI_FALLBACK_MODELS="$GEMINI_FALLBACK_V" \
            --from-literal=MINIO_ROOT_USER="$MINIO_U" \
            --from-literal=MINIO_ROOT_PASSWORD="$MINIO_P" \
            --from-literal=S3_ACCESS_KEY="$S3_AK" \
            --from-literal=S3_SECRET_KEY="$S3_SK"

      - name: Apply Kubernetes manifests
        if: steps.check-kube.outputs.dry-run == 'false'
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/postgres/
          kubectl apply -f k8s/redis/
          kubectl apply -f k8s/minio/
          kubectl apply -f k8s/backend/
          kubectl apply -f k8s/workers/
          kubectl apply -f k8s/y-websocket/
          kubectl apply -f k8s/ingress/

      - name: Update image tag in deployments
        if: steps.check-kube.outputs.dry-run == 'false'
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image-tag }}"
          kubectl set image deployment/pipelineiq-api api=$IMAGE -n pipelineiq
          kubectl set image deployment/worker-critical worker=$IMAGE -n pipelineiq
          kubectl set image deployment/worker-default worker=$IMAGE -n pipelineiq
          kubectl set image deployment/worker-bulk worker=$IMAGE -n pipelineiq
          kubectl set image deployment/worker-gemini worker=$IMAGE -n pipelineiq
          kubectl set image deployment/worker-streaming worker=$IMAGE -n pipelineiq
          kubectl set image deployment/worker-beat beat=$IMAGE -n pipelineiq
          kubectl set image deployment/sse-service sse=$IMAGE -n pipelineiq

      - name: Wait for rollout to complete
        if: steps.check-kube.outputs.dry-run == 'false'
        timeout-minutes: 10
        run: |
          kubectl rollout status deployment/pipelineiq-api -n pipelineiq --timeout=5m
          kubectl rollout status deployment/worker-default -n pipelineiq --timeout=5m
          kubectl rollout status deployment/worker-bulk -n pipelineiq --timeout=5m

      - name: Run smoke tests against production
        if: steps.check-kube.outputs.dry-run == 'false'
        run: |
          sleep 30

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://pipelineiq-api.onrender.com/healthz)
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: /healthz returned $HTTP_STATUS"
            exit 1
          fi
          echo "PASS: /healthz returned 200"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://pipelineiq-api.onrender.com/readyz)
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "WARN: /readyz returned $HTTP_STATUS (dependencies may still be starting)"
          fi

          echo "Deployment successful!"
          echo "API: https://pipelineiq-api.onrender.com"

      - name: Dry-run deploy (no KUBE_CONFIG — skipping k3s)
        if: steps.check-kube.outputs.dry-run == 'true'
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image-tag }}"
          echo "::group::Dry-Run Deployment Summary"
          echo "  Image built: $IMAGE"
          echo "  Registry:    ${{ env.REGISTRY }}"
          echo "  Namespace:   pipelineiq"
          echo "  Manifests:   k8s/ (namespace, configmap, postgres, redis, minio, backend, workers, y-websocket, ingress)"
          echo "  Deployments: pipelineiq-api, worker-critical, worker-default, worker-bulk, worker-gemini, worker-streaming, worker-beat, sse-service, y-websocket"
          echo "::endgroup::"
          echo ""
          echo "SKIPPED: k3s cluster not configured (set KUBE_CONFIG secret to enable real deploy)"
          echo "FAKE URL: https://api.pipelineiq.dry-run.example.com"
          echo "::notice title=Dry-Run Deploy::Image $IMAGE ready. No k3s cluster connected. FAKE URL: https://api.pipelineiq.dry-run.example.com"

      - name: Notify on failure
        if: failure()
        run: |
          echo "Deployment FAILED. Check the GitHub Actions log."
