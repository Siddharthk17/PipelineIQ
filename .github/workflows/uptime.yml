name: Uptime Check

# External 5-minute heartbeat against the public deployment. This is the only
# monitor that fires when the whole VM is unreachable (internal healthchecks
# can't page you when the host itself is down).
#
# Required repository secret: PRODUCTION_URL (e.g. https://demo.example.com
# or http://<EXTERNAL-IP>). Runs only when the secret exists; otherwise the
# job passes with a notice instead of failing every 5 minutes.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe public endpoints
    runs-on: ubuntu-latest
    steps:
      - name: Check PRODUCTION_URL secret
        id: cfg
        run: |
          if [ -z "${{ secrets.PRODUCTION_URL }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Uptime skipped::Set the PRODUCTION_URL repository secret to enable external monitoring."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe health + frontend + docs
        if: steps.cfg.outputs.configured == 'true'
        run: |
          BASE="${{ secrets.PRODUCTION_URL }}"
          fail=0
          for p in "/health" "/" "/docs"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$BASE$p" || echo "000")
            echo "$p -> $code"
            case "$p:$code" in
              "/health:200"|"/:307"|"/:200"|"/docs:200") ;;
              *) echo "::error title=Uptime probe failed::$p returned $code"; fail=1 ;;
            esac
          done
          exit $fail
