server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/promtail-positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # All PipelineIQ containers via their json-file logs on the host.
  # Labels let Grafana filter per service (compose_service="pipelineiq-api",
  # etc.). NOTE: no Docker socket / docker_sd_configs here (M-050) — the
  # socket grants root-equivalent escape, so Promtail reads the log files
  # statically instead of querying the Docker daemon.
  - job_name: pipelineiq-containers
    static_configs:
      - targets: [localhost]
        labels:
          __path__: /var/lib/docker/containers/*/*.log
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: compose_service
      - source_labels: [__meta_docker_container_log_stream]
        target_label: logstream
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
            message: message
      - labels:
          level:
