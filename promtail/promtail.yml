server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/promtail-positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # All PipelineIQ containers via the Docker daemon. Labels let Grafana
  # filter per service (compose_service="pipelineiq-api", etc.).
  - job_name: pipelineiq-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 30s
        filters:
          - name: name
            values: ["pipelineiq-*"]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: compose_service
      - source_labels: [__meta_docker_container_log_stream]
        target_label: logstream
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
            message: message
      - labels:
          level:
