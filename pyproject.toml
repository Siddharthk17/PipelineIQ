[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors (E501 line-length excluded below)
    "F",    # pyflakes
    "UP",   # pyupgrade
    "I",    # isort
    "B",    # bugbear
    "BLE",  # blind except
    "TRY",  # tryceratops
    "SIM",  # simplifications
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length: not enforced (readability over rigid width)
    "B008",  # function calls in defaults: FastAPI Depends() is idiomatic
    "B011",  # assert False without message (tests use bare asserts w/ messages)
    "TRY003",  # long messages in raises: HTTPException detail= is idiomatic here
    "TRY002",  # app code raises ValueError/RuntimeError with clear messages (not a library)
    "TRY004",  # same convention for type-shape guards; rule also misfires on service errors
    "UP042",  # keep str+Enum (stable str() serialization across versions)
    "BLE001",  # broad guards at worker/request boundaries map errors to results;
               # silent swallowing is still banned via S110/S112
    "E402",  # deferred module-level imports avoid circular imports at startup
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = [
    "S101",  # asserts are the test mechanism
    "RUF012",  # mutable class attrs in test fixtures (no shared production state)
]
"backend/alembic/**" = [
    "UP",    # autogenerated migration code keeps its template style
]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
show_error_codes = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "backend.alembic.*"
ignore_errors = true
