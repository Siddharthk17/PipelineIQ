global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
  # Golden-signals rules evaluated headlessly by Prometheus itself.
  # Grafana mirrors the same three alerts (managed, notifying) — see
  # grafana/provisioning/alerting/. If you add an Alertmanager later,
  # point it here and keep both layers in sync.

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  - job_name: "pipelineiq-api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
