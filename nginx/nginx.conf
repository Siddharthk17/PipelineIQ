worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Silence health check and metrics access log noise
    map $request_uri $loggable {
        ~^/health 0;
        ~^/livez 0;
        ~^/readyz 0;
        ~^/metrics 0;
        ~^/api/v1/pipelines/stream 0;
        ~^/api/v1/pipelines/[^/]+/stream 0;
        ~^/api/v1/runs/[^/]+/stream 0;
        ~^/api/runs/[^/]+/stream 0;
        ~^/api/v1/pipelines\? 0;
        ~^/api/v1/runs\? 0;
        ~\.(woff|woff2|css|js|png|jpg|jpeg|gif|ico|svg)(\?.*)?$ 0;
        ~^/_next/ 0;
        default 1;
    }

    # Anti-scrape / anti-hammer buckets for public, login-free endpoints.
    # Docs are cheap: generous. Jaeger/Prometheus/Flower UIs fan out into
    # bursts of API calls: strict sustained rate, roomy burst.
    limit_req_zone $binary_remote_addr zone=public_docs:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=public_heavy:10m rate=5r/s;
    limit_req_status 429;
    limit_req_log_level warn;

    include /etc/nginx/conf.d/*.conf;
}
