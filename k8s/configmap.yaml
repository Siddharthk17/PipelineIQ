apiVersion: v1
kind: ConfigMap
metadata:
  name: pipelineiq-config
  namespace: pipelineiq
data:
  MINIO_ENDPOINT: minio:9000
  S3_ENDPOINT_URL: http://minio:9000
  STORAGE_TYPE: s3
  S3_BUCKET: pipelineiq-uploads

  ENVIRONMENT: production
  DEBUG: "false"
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger-collector:4317

  CELERY_WORKERS_CRITICAL: "2"
  CELERY_WORKERS_DEFAULT: "4"
  CELERY_WORKERS_BULK: "2"
  # O2-005: CELERY_WORKERS_STREAMING / CELERY_CONCURRENCY_BULK /
  # CELERY_CONCURRENCY_GEMINI were removed — no code reads them (the
  # streaming worker hardcodes --concurrency=8, bulk/gemini use the
  # CELERY_WORKERS_* keys above), so they only misled operators.

  GUNICORN_WORKERS: "4"

  APP_VERSION: "12.8.4"

  MAX_UPLOAD_SIZE: "524288000"

  RATE_LIMIT_PIPELINE_RUN: 10/minute
  RATE_LIMIT_FILE_UPLOAD: 30/minute
  RATE_LIMIT_VALIDATION: 60/minute
  RATE_LIMIT_READ: 120/minute
