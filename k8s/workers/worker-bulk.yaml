apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-bulk
  namespace: pipelineiq
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker-bulk
  template:
    metadata:
      labels:
        app: worker-bulk
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/siddharthk17/pipelineiq-backend:12.8.4
          imagePullPolicy: Always
          command:
            - celery
            - -A
            - backend.celery_app
            - worker
            - --queues=bulk
            - --concurrency=2
            - --prefetch-multiplier=1
            - --hostname=bulk@%(h)s
            - --loglevel=info
          workingDir: /app
          envFrom:
            - configMapRef:
                name: pipelineiq-config
            - secretRef:
                name: pipelineiq-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: pipelineiq-worker-bulk
          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - backend.celery_app
                - inspect
                - ping
                - --timeout=5
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - celery
                - -A
                - backend.celery_app
                - inspect
                - ping
                - --timeout=5
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
