apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-gemini
  namespace: pipelineiq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-gemini
  template:
    metadata:
      labels:
        app: worker-gemini
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/siddharthk17/pipelineiq-backend:12.28.10
          imagePullPolicy: Always
          command:
            - celery
            - -A
            - backend.celery_app
            - worker
            - --queues=gemini
            - --concurrency=1
            - --prefetch-multiplier=1
            - --hostname=gemini@%(h)s
            - --loglevel=info
          workingDir: /app
          envFrom:
            - configMapRef:
                name: pipelineiq-config
            - secretRef:
                name: pipelineiq-secrets
          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - backend.celery_app
                - inspect
                - ping
                - --timeout=5
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - celery
                - -A
                - backend.celery_app
                - inspect
                - ping
                - --timeout=5
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
