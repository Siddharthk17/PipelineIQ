apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-beat
  namespace: pipelineiq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-beat
  template:
    metadata:
      labels:
        app: worker-beat
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: beat
          # NOTE (R-O-005): intentionally no liveness/readiness probe here.
          # celery beat is a singleton scheduler with no queryable endpoint
          # (`celery inspect ping` only reaches workers). Kubelet restarts
          # it on crash (restartPolicy via the Deployment default); missed
          # ticks are visible in the scheduler logs and the reconciler
          # converges orphaned schedules (M-018).
          image: ghcr.io/siddharthk17/pipelineiq-backend:latest
          imagePullPolicy: Always
          command:
            - celery
            - -A
            - backend.celery_app
            - beat
            - --loglevel=info
          workingDir: /app
          envFrom:
            - configMapRef:
                name: pipelineiq-config
            - secretRef:
                name: pipelineiq-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
