apiVersion: apps/v1
kind: Deployment
metadata:
  name: y-websocket
  namespace: pipelineiq
  labels:
    app: y-websocket
spec:
  replicas: 1
  selector:
    matchLabels:
      app: y-websocket
  template:
    metadata:
      labels:
        app: y-websocket
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: y-websocket
          image: ghcr.io/siddharthk17/pipelineiq-y-websocket:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 1234
              name: ws
          env:
            - name: PORT
              value: "1234"
            - name: REDIS_YJS_URL
              valueFrom:
                secretKeyRef:
                  name: pipelineiq-secrets
                  key: REDIS_YJS_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pipelineiq-secrets
                  key: SECRET_KEY
            # Room membership source for the Yjs authz gate (M-005/R-O-002).
            # The relay GETs ${PIPELINE_API_URL}/api/v1/versions/{room} with
            # the caller's JWT: 200 = member, anything else = deny.
            - name: PIPELINE_API_URL
              value: "http://pipelineiq-api:8000"
          envFrom:
            - configMapRef:
                name: pipelineiq-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "200m"
          livenessProbe:
            tcpSocket:
              port: 1234
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: y-websocket
  namespace: pipelineiq
spec:
  selector:
    app: y-websocket
  ports:
    - port: 1234
      targetPort: 1234
      name: ws
  type: ClusterIP
